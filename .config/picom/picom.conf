# Mirrors Hyprland decoration{}: rounding 10, blur, shadows, 0.9 inactive opacity.
# Rofi is left alone, like wofi: Hyprland doesn't decorate layer surfaces.
backend = "glx";
vsync = true;

corner-radius = 10;
rounded-corners-exclude = [
  "class_g = 'Polybar'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'Rofi'"
];

shadow = true;
shadow-radius = 8;
shadow-opacity = 0.9;
shadow-offset-x = -6;
shadow-offset-y = -6;
shadow-color = "#1a1a1a";
shadow-exclude = [
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dock'",
  "class_g = 'Rofi'"
];

blur-method = "dual_kawase";
blur-strength = 3;
blur-background-exclude = [
  "window_type = 'desktop'",
  "_GTK_FRAME_EXTENTS@:c",
  "class_g = 'Rofi'"
];

active-opacity = 1.0;
inactive-opacity = 0.9;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
  "100:fullscreen",
  "100:class_g = 'firefox' && focused",
  "100:class_g = 'i3lock'",
  "100:class_g = 'Rofi'"
];

fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 6;

detect-rounded-corners = true;
detect-client-opacity = true;
use-damage = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

wintypes: {
  tooltip = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};
