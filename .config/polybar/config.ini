; Styled after jozedash/dotfiles waybar: three floating magenta-bordered pills.

[colors]
background = #b33f3f3f
foreground = #d8dee9
primary = #ff00ff
alert = #ff0000
dim = #aeaeae

[bar/base]
monitor = ${env:MONITOR:}
height = 27
offset-y = 4
radius = 13
border-size = 2
border-color = ${colors.primary}
background = ${colors.background}
foreground = ${colors.foreground}
padding = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = Symbols Nerd Font:size=11;3
font-2 = Noto Sans Symbols2:size=10;3
# i3 stacks every dock bar as its own full-width row, so float them and reserve space with an i3 top gap.
override-redirect = true
wm-restack = i3
enable-ipc = true
cursor-click = pointer

[bar/left]
inherit = bar/base
width = 42%:-5
offset-x = 5
modules-left = logo clock disk memory cpu temperature powerdraw xwindow

[bar/centre]
inherit = bar/base
width = 12%
offset-x = 44%
modules-center = i3

[bar/right]
inherit = bar/base
width = 42%:-5
offset-x = 58%
modules-right = tray backlight pulseaudio network battery

[module/logo]
type = custom/text
format = 
format-foreground = ${colors.primary}
click-left = rofi -show drun

[module/clock]
type = internal/date
interval = 1
date = %I:%M:%S %p
date-alt = %a %d %b %Y
label = %date%
label-foreground = ${colors.primary}

[module/disk]
type = internal/fs
mount-0 = /
interval = 30
label-mounted =  %percentage_used%%

[module/memory]
type = internal/memory
interval = 2
label =  %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 1
label =  %percentage:2%%

[module/temperature]
type = internal/temperature
interval = 2
zone-type = x86_pkg_temp
warn-temperature = 85
label =  %temperature-c%
label-warn =  %temperature-c%
label-warn-foreground = ${colors.alert}

[module/powerdraw]
type = custom/script
exec = ~/.config/polybar/scripts/powerdraw.sh
interval = 2

[module/xwindow]
type = internal/xwindow
label = ( %title:0:40:...% )
label-empty =

[module/i3]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.py
tail = true
scroll-up = i3-msg -q workspace prev_on_output
scroll-down = i3-msg -q workspace next_on_output

[module/tray]
type = internal/tray
tray-spacing = 10px
tray-size = 60%

[module/backlight]
type = internal/backlight
card = intel_backlight
use-actual-brightness = true
enable-scroll = true
format = <ramp>
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
ramp-5 = 
ramp-6 = 
ramp-7 = 
ramp-8 = 
ramp-9 = 

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume> <ramp-volume>
label-volume = %percentage%%
ramp-volume-0 = 🕨
ramp-volume-1 = 🕩
ramp-volume-2 = 🕪
label-muted = 
label-muted-foreground = ${colors.alert}
click-right = pavucontrol

[module/network]
type = internal/network
interface-type = wireless
interval = 3
label-connected = 
label-disconnected = 
click-left = nm-connection-editor

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
low-at = 20
format-discharging = <label-discharging> <ramp-capacity>
format-charging = <label-charging> 󰂄
format-full = <label-full> 󰁹
label-discharging = %percentage%%
label-charging = %percentage%%
label-full = %percentage%%
format-low = <label-low> <ramp-capacity>
label-low = %percentage%%
format-low-foreground = ${colors.alert}
ramp-capacity-0 = 󰁻
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹

[settings]
screenchange-reload = true
pseudo-transparency = false
