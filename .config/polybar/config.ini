; Styled after jozedash/dotfiles waybar: three floating pills bordered in the theme's primary.
; Colours follow the theme: colors.ini is written by ~/.config/theme/theme-apply.
include-file = colors.ini

[bar/base]
monitor = ${env:MONITOR:}
height = 27
offset-y = 4
radius = 13
border-size = 2
border-color = ${colors.primary}
background = ${colors.background}
foreground = ${colors.foreground}
padding = 2
module-margin = 1
font-0 = JetBrainsMono Nerd Font:size=10;3
font-1 = Symbols Nerd Font:size=11;3
font-2 = Noto Sans Symbols2:size=10;3
# i3 stacks every dock bar as its own full-width row, so float them and reserve space with an i3 top gap.
override-redirect = true
wm-restack = i3
enable-ipc = true
cursor-click = pointer

[bar/left]
inherit = bar/base
width = 42%:-5
offset-x = 5
modules-left = logo clock weather disk memory cpu temperature powerdraw xwindow

[bar/centre]
inherit = bar/base
width = 12%
offset-x = 44%
modules-center = i3

[bar/right]
inherit = bar/base
width = 42%:-5
offset-x = 58%
modules-right = updates tray usb notification clipboard backlight idle colorpicker theme bluetooth pulseaudio network battery

[module/logo]
type = custom/text
format = 
format-foreground = ${colors.primary}
click-left = rofi -show drun

[module/clock]
type = internal/date
interval = 1
date = %I:%M:%S %p
date-alt = %a %d %b %Y
label = %date%
label-foreground = ${colors.primary-text}

; Current temperature from wttr.in; hidden when offline
[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 900
click-left = xdg-open https://wttr.in

[module/disk]
type = internal/fs
mount-0 = /
interval = 30
label-mounted =  %percentage_used%%

[module/memory]
type = internal/memory
interval = 2
format = %{A1:kitty -e htop &:}<label>%{A}
label =  %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 1
format = %{A1:kitty -e htop &:}<label>%{A}
label =  %percentage:2%%

[module/temperature]
type = internal/temperature
interval = 2
zone-type = x86_pkg_temp
warn-temperature = 85
format = %{A1:kitty -e btop &:}<label>%{A}
format-warn = %{A1:kitty -e btop &:}<label-warn>%{A}
label =  %temperature-c%
label-warn =  %temperature-c%
label-warn-foreground = ${colors.alert}

[module/powerdraw]
type = custom/script
exec = ~/.config/polybar/scripts/powerdraw.sh
interval = 5

[module/xwindow]
type = internal/xwindow
label = ( %title:0:40:...% )
label-empty =

[module/i3]
type = custom/script
exec = ~/.config/polybar/scripts/workspaces.py
tail = true
scroll-up = i3-msg -q workspace prev_on_output
scroll-down = i3-msg -q workspace next_on_output

; Updates downloaded by apt-download.timer; hidden when there's nothing to do
[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 60
click-left = kitty -e ~/.config/polybar/scripts/upgrade.sh &

[module/tray]
type = internal/tray
tray-spacing = 10px
tray-size = 60%

; Drives mounted by udiskie (hidden when there are none); udiskie's event_hook refreshes it
[module/usb]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/usb.sh
initial = 1
click-left = nemo /media/$USER &
click-right = udiskie-umount --all

; dunst has no notification centre: click shows the last one again, right-click toggles do not disturb
[module/notification]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/notification.sh
initial = 1
click-left = dunstctl history-pop
click-right = ~/.config/polybar/scripts/notification.sh toggle

[module/clipboard]
type = custom/text
format = 󰅇
click-left = copyq menu

[module/backlight]
type = internal/backlight
card = ${env:BACKLIGHT:intel_backlight}
# The set level, like Waybar: actual_brightness reads 0 while the panel is off (docked),
# and Polybar never fills in the label until the value first changes
use-actual-brightness = false
enable-scroll = true
format = <ramp> <label>
label = %percentage%%
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
ramp-5 = 
ramp-6 = 
ramp-7 = 
ramp-8 = 
ramp-9 = 

; Stands in for waybar's idle_inhibitor: click to stop locking, blanking and suspending
[module/idle]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/idle.sh
initial = 1
click-left = ~/.config/polybar/scripts/idle.sh toggle

; Swatch of the last picked colour; click picks a new one
[module/colorpicker]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/colorpicker.sh -p
initial = 1
click-left = ~/.config/polybar/scripts/colorpicker.sh &

; Theme switcher (see ~/.config/theme): palette popup, next favourite, dark/light
[module/theme]
type = custom/text
format = 󰏘
format-foreground = ${colors.primary-text}
click-left = ~/.config/theme/theme-popup &
click-right = ~/.config/theme/theme-apply --cycle-favourite &
click-middle = ~/.config/theme/theme-apply --toggle-mode &

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 5
click-left = blueman-manager &

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
format-volume = <label-volume> <ramp-volume>
label-volume = %percentage%%
ramp-volume-0 = 🕨
ramp-volume-1 = 🕩
ramp-volume-2 = 🕪
label-muted = 
label-muted-foreground = ${colors.alert}
click-right = pavucontrol

[module/network]
type = internal/network
interface-type = wireless
interval = 3
label-connected =  %signal%%
label-disconnected = 
click-left = nm-connection-editor

[module/battery]
type = internal/battery
battery = ${env:BATTERY:BAT0}
adapter = ${env:ADAPTER:AC}
poll-interval = 5
low-at = 20
format-discharging = <label-discharging> <ramp-capacity>
format-charging = <label-charging> 󰂄
format-full = <label-full> 󰁹
label-discharging = %percentage%%
label-charging = %percentage%%
label-full = %percentage%%
format-low = <label-low> <ramp-capacity>
label-low = %percentage%%
format-low-foreground = ${colors.alert}
ramp-capacity-0 = 󰁻
ramp-capacity-1 = 󰁼
ramp-capacity-2 = 󰁾
ramp-capacity-3 = 󰂀
ramp-capacity-4 = 󰂂
ramp-capacity-5 = 󰁹

[settings]
screenchange-reload = true
pseudo-transparency = false
